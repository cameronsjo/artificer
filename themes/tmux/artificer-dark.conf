# Artificer Dark — tmux styles
# Drop in: ~/.config/tmux/artificer-dark.conf
# Then in tmux.conf:  source-file ~/.config/tmux/artificer-dark.conf
#
# Hybrid color strategy: ANSI colour13 for accents (routes through
# Ghostty's loaded palette → brandPurpleBright), hex for design-system
# greys not present in the ANSI 16.
#
# Generated from themes/_palette.json — edit there + re-run build.mjs.

set -g status-style "bg=#313540,fg=#e8e6e1"
set -g status-left-style "fg=colour13,bold"
set -g status-right-style "fg=#c5c8c6"

setw -g window-status-style "fg=#c5c8c6"
setw -g window-status-current-style "fg=colour13,bold"
# Load-bearing: tmux defaults both of these to `reverse`, which swaps fg/bg and
# paints a light slab over the status bar. The window list is deliberately
# two-state — active or not — so activity and bell match the inactive style
# exactly. Do not "restore" a distinct treatment here.
setw -g window-status-activity-style "fg=#c5c8c6"
setw -g window-status-bell-style "fg=#c5c8c6"

set -g pane-border-style "fg=#4a4f5c"
set -g pane-active-border-style "fg=colour13"

set -g message-style "bg=#313540,fg=colour13,bold"
