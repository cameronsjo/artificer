# Artificer v0.22.1 · Dark — herdr theme block
# herdr has no external theme-file mechanism; [theme.custom] lives inside your
# own ~/.config/herdr/config.toml. Two install paths:
#
#   1. Paste these two tables into ~/.config/herdr/config.toml,
#      then: herdr server reload-config
#   2. Splice in via chezmoi templating — see themes/README.md
#
# Generated from themes/_palette.json — edit there + re-run build.mjs.

[theme]
# Base only governs surfaces herdr does not expose; [theme.custom] below
# overrides all 16 CustomThemeColors fields.
name = "catppuccin"

[theme.custom]
accent      = "#dbbb6f"  # accent — highlights, borders, navigation UI
panel_bg    = "#292c33"  # bg — the substrate (ADR 0036)
surface0    = "#313540"  # bgRaised — raised panel
surface1    = "#3c4150"  # bgOverlay — selected row
surface_dim = "#1d1f21"  # bgInactive — unfocused pane
overlay0    = "#666666"  # fgDisabled — dim text — disabled tier (2.43 / 4.80)
overlay1    = "#5a7a8a"  # fgMuted — muted meta/comment (3.05 / 3.83)
text        = "#e8e6e1"  # fg — 11.21 / 13.13
subtext0    = "#c5c8c6"  # fgSecondary — 8.29 / 8.63
mauve       = "#b095e0"  # brandPurpleBright — 5.47 / 6.83
green       = "#5fa073"  # successBright — 4.50 / 4.86
yellow      = "#dbbb6f"  # accent — 7.55 / 5.33 — same token as accent; Artificer accent IS gold
red         = "#e6a8a2"  # urgentText — 6.98 / 7.49 — the text-tier red; bare urgent is 2.28 on dark
blue        = "#b8cad4"  # steel — 8.28 / 7.83
teal        = "#7da6a4"  # cyan — 5.23 / 5.10
peach       = "#d6936a"  # attentionAlt — 5.49 / 5.25
