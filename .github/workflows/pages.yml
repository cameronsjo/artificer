name: Deploy Pages

# Publishes the live-spec/ reference as a GitHub Pages site.
# /artificer/ → live-spec/index.html (the landing); /artificer/<page>.html →
# each component reference page. Source = GitHub Actions (not branch-based).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

# One in-flight deploy at a time; let a newer push supersede a queued run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload live-spec as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: live-spec

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
