name: CI

# Lint + test gate for PRs and pushes to main. Distinct from release-npm.yml
# (tag-gated publish). One lane:
#
#   check   — the dependency-free data gates (contrast #62, palette drift #61,
#             version sync #66, tokens sync #60, mirror parity #78). Only Node
#             built-ins; no install step. Stays fast.
#
# The workshop's browser trust layer (Playwright) and the A1 audit stay
# private — the public package ships no tests/.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Unit tests
        run: npm test

      - name: Syntax contrast gate (#62)
        run: npm run check:contrast

      - name: Palette-drift lint (#61)
        run: npm run lint:palette

      - name: Version sync check (#66)
        run: npm run check:version

      - name: Tokens sync check (#60)
        run: npm run check:tokens

      - name: live-spec mirror parity (#78)
        run: npm run check:livespec
