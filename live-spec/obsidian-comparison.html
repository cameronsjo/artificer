<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Artificer · Obsidian Theme Comparison</title>
<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('assets/fonts/jetbrains-mono-400.woff2') format('woff2');
    font-weight: 400; font-display: swap;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('assets/fonts/jetbrains-mono-500.woff2') format('woff2');
    font-weight: 500; font-display: swap;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('assets/fonts/jetbrains-mono-700.woff2') format('woff2');
    font-weight: 700; font-display: swap;
  }

  :root {
    --bg: #0a0a0a;
    --bg-raised: #161616;
    --fg: #e8e6e1;
    --fg-muted: #8a877f;
    --border: #2a2a2a;
    --accent: #b8cad4;
    --gold: #e3c885;
    --brick: #a04540;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
  }

  /* Chrome ───────────────────────────────────────────────── */
  .chrome {
    display: grid;
    grid-template-rows: 64px 1fr;
    height: 100vh;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    gap: 24px;
  }
  .topbar-title {
    display: flex;
    align-items: baseline;
    gap: 12px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .topbar-title .crumb {
    font-weight: 400;
    color: var(--fg-muted);
    font-size: 12px;
  }
  .topbar-title .arr {
    color: var(--fg-muted);
    font-size: 10px;
    margin: 0 4px;
  }

  .topbar-controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .control-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--fg-muted);
  }
  .seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .seg button {
    appearance: none;
    background: transparent;
    border: none;
    color: var(--fg-muted);
    font: inherit;
    font-size: 12px;
    padding: 6px 14px;
    cursor: pointer;
    border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: none; }
  .seg button.is-active {
    background: var(--bg-raised);
    color: var(--fg);
  }

  /* Comparison grid ──────────────────────────────────────── */
  .compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100%;
    overflow: hidden;
  }
  .pane {
    display: grid;
    grid-template-rows: 44px 1fr;
    height: 100%;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }
  .pane:last-child { border-right: none; }

  .pane-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-raised);
  }
  .pane-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 700;
    color: var(--fg);
  }
  .pane-version {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--border);
    color: var(--fg-muted);
    letter-spacing: 0.08em;
  }
  .pane-version.v06 { background: color-mix(in oklch, var(--accent) 18%, transparent); color: var(--accent); }
  .pane-version.v05 { background: color-mix(in oklch, var(--gold) 18%, transparent); color: var(--gold); }

  .pane-swatches {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  .pane-swatches .chip {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .pane-meta {
    font-size: 10px;
    color: var(--fg-muted);
    letter-spacing: 0.06em;
  }

  .pane-frame {
    position: relative;
    overflow: hidden;
  }
  .pane-frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Bottom callout strip ─────────────────────────────────── */
  .compare-notes {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-raised);
    border-top: 1px solid var(--border);
    padding: 8px 18px;
    font-size: 11px;
    color: var(--fg-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    transform: translateY(100%);
    transition: transform 240ms cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .compare-notes.is-visible {
    transform: translateY(0);
  }
  .compare-notes .note-key {
    display: inline-block;
    padding: 1px 5px;
    margin: 0 4px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 9px;
    color: var(--fg);
  }
</style>
</head>
<body>
<div class="chrome">

  <header class="topbar">
    <div class="topbar-title">
      <span>Obsidian theme</span>
      <span class="arr">›</span>
      <span class="crumb">v0.5 dropped <span class="arr">vs</span> v0.6 current</span>
    </div>

    <div class="topbar-controls">
      <span class="control-label">Mode</span>
      <div class="seg" role="tablist">
        <button data-mode="dark" class="is-active" type="button">Dark</button>
        <button data-mode="light" type="button">Light (paper)</button>
      </div>
    </div>
  </header>

  <main class="compare">

    <section class="pane">
      <div class="pane-header">
        <span class="pane-label">Dropped theme</span>
        <span class="pane-version v05">v0.5 palette</span>
        <div class="pane-swatches" aria-hidden="true">
          <span class="chip" style="background:#292c33" title="Ghostty grey bg"></span>
          <span class="chip" style="background:#e0b558" title="Gold accent"></span>
          <span class="chip" style="background:#e5afb7" title="Dusty rose"></span>
          <span class="chip" style="background:#b7bd73" title="Olive success"></span>
          <span class="chip" style="background:#e8836f" title="Vermillion urgent"></span>
        </div>
      </div>
      <div class="pane-frame">
        <iframe id="frame-dropped" src="obsidian-compare/dropped.html" title="Dropped theme"></iframe>
      </div>
    </section>

    <section class="pane">
      <div class="pane-header">
        <span class="pane-label">Current (generated)</span>
        <span class="pane-version v06">v0.6 palette</span>
        <div class="pane-swatches" aria-hidden="true">
          <span class="chip" style="background:#20203e" title="Indigo ink bg"></span>
          <span class="chip" style="background:#b8cad4" title="Steel accent"></span>
          <span class="chip" style="background:#5fa073" title="Apothecary green"></span>
          <span class="chip" style="background:#e3c885" title="Gold attention"></span>
          <span class="chip" style="background:#a04540" title="Brick destructive"></span>
        </div>
      </div>
      <div class="pane-frame">
        <iframe id="frame-current" src="obsidian-compare/current.html" title="Current generated theme"></iframe>
      </div>
    </section>

  </main>

  <div class="compare-notes" id="notes">
    <span>Side-by-side: identical Markdown, same DOM, different theme CSS. <span class="note-key">D</span> dark · <span class="note-key">L</span> light · <span class="note-key">?</span> toggle this strip</span>
    <span>Note: scroll each pane independently to compare specific surfaces.</span>
  </div>
</div>

<script>
  const frames = [
    document.getElementById('frame-dropped'),
    document.getElementById('frame-current'),
  ];
  const setMode = (mode) => {
    frames.forEach(f => {
      try { f.contentWindow.postMessage({ type: 'set-theme', mode }, '*'); } catch (e) {}
    });
    document.querySelectorAll('.seg button').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.mode === mode);
    });
  };
  document.querySelectorAll('.seg button').forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea')) return;
    if (e.key === 'd' || e.key === 'D') setMode('dark');
    if (e.key === 'l' || e.key === 'L') setMode('light');
    if (e.key === '?') {
      document.getElementById('notes').classList.toggle('is-visible');
    }
  });
</script>
</body>
</html>
